name: yuhai_vpn
description: 宇海加密VPN
publish_to: none
version: 1.1.0+110

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  local_auth: ^2.3.0
  share_plus: ^10.1.2
  package_info_plus: ^8.1.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  ffi: ^2.1.4
  pointycastle: ^3.9.1
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
