name: yuhai_vpn
description: 宇海加密VPN
publish_to: none
version: 1.1.0+110

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  local_auth: ^2.3.0
  share_plus: ^10.1.2
  package_info_plus: ^8.1.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  ffi: ^2.1.4
  pointycastle: ^3.9.1
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  fake_async: ^1.3.3
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
  # 吉祥物艾丽（全身像，透明底 WebP）：首页大圆按钮旁边、电脑版最大化时的右侧。
  assets:
    - assets/images/aili.webp
  # Noto Sans SC（SIL OFL，见 assets/fonts/OFL.txt）。
  # 子集含 GB2312 与界面里出现的字符，真机和截图用同一套字，不依赖系统里是否装了中文。
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
        - asset: assets/fonts/NotoSansSC-Medium.otf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 600
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 700
    # 改版的展示字体，都是 SIL OFL（许可见 assets/fonts/SmileySans-OFL.txt、Unbounded-OFL.txt）。
    # 得意黑：大标题；按 OFL 保留字体名条款，这里用的是官方发布的原文件，没有改动。
    - family: YhDisplay
      fonts:
        - asset: assets/fonts/SmileySans-Oblique.otf
    # Unbounded：价格、计时等大号数字和英文小标签。从官方可变字体导出 500、700 两个字重，只留拉丁字符。
    - family: YhLatin
      fonts:
        - asset: assets/fonts/Unbounded-Medium.ttf
          weight: 500
        - asset: assets/fonts/Unbounded-Bold.ttf
          weight: 700
