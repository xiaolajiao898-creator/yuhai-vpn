name: yuhai_vpn
description: 宇海加密VPN
publish_to: none
version: 1.1.0+110

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.0
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  local_auth: ^2.3.0
  share_plus: ^10.1.2
  package_info_plus: ^8.1.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  ffi: ^2.1.4
  pointycastle: ^3.9.1
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.6.1

flutter:
  uses-material-design: true
  # Noto Sans SC（SIL OFL，见 assets/fonts/OFL.txt）。
  # 子集含 GB2312 与界面里出现的字符，真机和截图用同一套字，不依赖系统里是否装了中文。
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.otf
        - asset: assets/fonts/NotoSansSC-Medium.otf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 600
        - asset: assets/fonts/NotoSansSC-Bold.otf
          weight: 700
