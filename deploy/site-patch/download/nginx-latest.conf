# 官网下载入口。当前安装包由 API 决定，这里只做跳转，不把文件名写死。
# 版本化文件放在 /download/builds/，缓存可以很长；latest 和旧文件名每分钟跟着当前发布走。

location = /download/latest/windows {
    proxy_pass https://api.yhvpn.io/v1/app/download/windows;
    proxy_ssl_server_name on;
    add_header Cache-Control "public, max-age=60" always;
}

location = /download/latest/android {
    proxy_pass https://api.yhvpn.io/v1/app/download/android;
    proxy_ssl_server_name on;
    add_header Cache-Control "public, max-age=60" always;
}

location = /download/YuhaiVPN-Windows-x64.exe {
    return 302 /download/latest/windows;
}
location = /download/YuhaiVPN-Windows-x64-candidate.exe {
    return 302 /download/latest/windows;
}
location ~ ^/download/YuhaiVPN-Windows-.*\.exe$ {
    return 302 /download/latest/windows;
}
location = /download/yuhai-vpn-candidate-0928.apk {
    return 302 /download/latest/android;
}

location /download/builds/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
