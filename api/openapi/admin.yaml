      summary: 新建节点记录（只是登记，不会去联系任何机器）
      description: |
        新建的节点**一律为 MAINTENANCE**，且不可在本接口指定状态：它还没有证书、没有心跳，
        任何「立即上线」都会是假的。上线要等节点注册并开始心跳后，再用 PATCH 改状态。
        `agent_cert_fingerprint` **不可由本接口设置**——那是节点注册流程的产物，
        允许管理员直接写入等于允许把一个节点身份指到任意证书上。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, group_id, name, country_code, city, region, host]
              properties:
                operation_id: { type: string, format: uuid }
                group_id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
                name: { type: string, minLength: 1, maxLength: 64 }
                country_code: { type: string, pattern: '^[A-Z]{2}$' }
                city: { type: string, maxLength: 64 }
                region: { type: string, minLength: 1, maxLength: 32 }
                host: { type: string, minLength: 1, maxLength: 255, description: 节点主机名或 IP；只登记，不做连通性探测 }
                probe_port: { type: integer, minimum: 1, maximum: 65535, default: 443 }
                capacity_users: { type: integer, minimum: 0, maximum: 1000000, default: 500 }
                sort_order: { type: integer, minimum: -100000, maximum: 100000, default: 0 }
                is_recommended: { type: boolean, default: false }
      responses:
        '201':
          description: 已创建，status 恒为 MAINTENANCE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedNode' }
        '404': { description: 40401 分组不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { description: 40901 同一 operation_id 提交了不同内容, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
  /nodes/{id}:
    get:
      operationId: getNode
      x-admin-level: L0
