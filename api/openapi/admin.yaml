  /deposit-exceptions/{id}/resolve:
    post:
      operationId: resolveDepositException
      x-admin-level: L3
      x-permission: finance.deposit_exception
      summary: 处置一笔到账异常（双人审批；这是第一个真正动用户钱的后台接口）
      description: |
        自动结算匹配不上时，转账会被丢进异常队列而**绝不自动入账到猜测的用户**。
        这个接口是那条队列唯一的出路。三种处置：

        | action | 做什么 | 必填 |
        |---|---|---|
        | TO_ORDER | 把这笔钱记到指定订单上，走**与自动结算完全相同的那一段**（订单 → PAID → 先入后扣 → 开通权益 → COMPLETED、转账 MATCHED、写 outbox） | `order_no` |
        | TO_BALANCE | 把钱记进指定账户的余额（EXCEPTION_CREDIT），不牵扯任何订单 | `user_account_no` |
        | REJECT | 不动钱，只留档说明为什么不处理（地址投毒、第三方误转等）。转账保持 EXCEPTION——它确实没有被记到任何人头上 | — |

        不属于该动作的字段一律 40001 拒绝，不静默忽略：一张写着 `order_no` 的 REJECT
        审批单，审批人多半会以为钱进了那张订单。

        **返回 202 时钱还没有动。** 这是 L3：发起只建审批单，真正记账发生在另一名同样
        持有 `finance.deposit_exception` 的管理员点通过时，且发起人不能审批自己的申请。

        审批单的 payload 里固定着**发起时系统看到的事实**——转账编号、异常原因、金额
        （固定 6 位小数字符串）。执行前重新核对：金额变了、转账已被自动结算认领走、
        或异常已被处置过，一律 40908 拒绝执行而不是将错就错。

        只处理 OPEN 的异常。已处置的绝不允许翻案——那等于第二次动钱。
        同一笔异常同时只允许一张待审批单；换一种处置方式要先让旧单被审批或过期（40901）。

        TO_ORDER 的两点提醒（两者都不阻止处置，但都会如实记进结果，供两位审批人判断）：
        金额与订单应付不一致是常态（`AMOUNT_MISMATCH` 本来就是异常原因之一）；
        付款地址与订单当初分配的地址可以不一致（用户复用旧地址是真实场景）。

        错误：动作或必填字段不对 40001；异常/订单/账户不存在 40401；
        异常已处置、订单状态不能接收到账、订单已关联转账 40905；
        已有待审批单 40901；执行时与审批时不一致 40908。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, note]
              properties:
                action: { type: string, enum: [TO_ORDER, TO_BALANCE, REJECT] }
                order_no: { type: string, maxLength: 24, description: 仅 TO_ORDER；其余动作携带即 400 }
                user_account_no: { type: string, maxLength: 10, description: 仅 TO_BALANCE；其余动作携带即 400 }
                note: { type: string, minLength: 1, maxLength: 500, description: 与其余 L3 动作的 reason 同一套校验；落进 deposit_exceptions.resolution_note }
      responses: { '202': { $ref: '#/components/responses/Approval' }, default: { $ref: '#/components/responses/Error' } }

  /receive-addresses:
    get:
      operationId: listReceiveAddresses
      x-admin-level: L0
      x-permission: finance.read
      summary: 收款地址列表（只读，无查询参数）
      description: |
        **不返回地址签名本身**。旧地址可能带签名密钥编号；管理员登记的地址没有资金密钥，
