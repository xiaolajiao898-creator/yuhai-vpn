openapi: 3.1.0
info:
  title: 宇海加密VPN 管理后台 API
  version: 1.0.0
  description: |
    仅管理区可达（方案 11.6、12.4）。Cookie 会话 + CSRF；写请求携带 X-CSRF-Token。
    `x-admin-level`：L0 只读；L1 普通写；L2 二级验证（X-Step-Up-Token）；L3 双人审批（返回 202 + approval_id）。
    开发工具 `/dev/*` 仅在 APP_ENV != production 且 DEV_TOOLS_ENABLED=true 时注册。
servers:
  - url: https://admin.example.internal/admin/v1

paths:
  /auth/login:
    post:
      operationId: adminLogin
      x-admin-level: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string } } }
      responses:
        '200':
          description: 返回 2 分钟有效的 mfa_ticket
          content: { application/json: { schema: { type: object, required: [mfa_ticket], properties: { mfa_ticket: { type: string } } } } }
        default: { $ref: '#/components/responses/Error' }
  /auth/mfa:
    post:
      operationId: adminMfa
      x-admin-level: none
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [mfa_ticket, totp_code], properties: { mfa_ticket: { type: string }, totp_code: { type: string } } }
      responses:
        '200':
          description: Set-Cookie yh_admin（HttpOnly; Secure; SameSite=Strict）
          content: { application/json: { schema: { type: object, required: [csrf_token], properties: { csrf_token: { type: string } } } } }
        default: { $ref: '#/components/responses/Error' }
  /auth/me:
    get:
      operationId: adminMe
      x-admin-level: L0
      responses:
        '200':
          description: 当前已验证管理员会话；Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [id, username, permissions, csrf_token]
                properties:
                  id: { type: string }
                  username: { type: string }
                  permissions: { type: array, items: { type: string } }
                  csrf_token: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /auth/logout:
    post: { operationId: adminLogout, x-admin-level: L0, responses: { '204': { description: OK } } }

  /step-up:
    post:
      operationId: stepUp
      x-admin-level: L1
      summary: 二级验证：签发绑定操作、目标路径及原始请求体的一次性令牌（5 分钟）
      description: |
        payload_hash 为 SHA-256("v1\n" + 大写 HTTP 方法 + "\n" + 完整请求路径（含 /admin/v1 和查询字符串）+ "\n" + 原始 UTF-8 请求体字节) 的小写十六进制。
        无请求体用空字节；获取令牌后不得重新序列化或修改请求。action_code 必须是当前管理员具备的 L2/L3 权限。
        每个动态口令仅可使用一次；与登录动态口令重复时请等待下一组。令牌与受保护写入在同一事务中消费。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action_code, payload_hash, totp_code]
              additionalProperties: false
              properties: { action_code: { type: string, maxLength: 64 }, payload_hash: { type: string, pattern: '^[a-f0-9]{64}$' }, totp_code: { type: string, pattern: '^[0-9]{6}$' } }
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { type: object, required: [step_up_token, expires_at], properties: { step_up_token: { type: string }, expires_at: { type: string, format: date-time } } } } }
        default: { $ref: '#/components/responses/Error' }

  /dashboard:
    get:
      operationId: getDashboard
      x-admin-level: L0
      summary: 后台总览（按调用者实际持有的能力分段）
      description: |
        总览是跨域视图：users / nodes / traffic / finance / invite / site 六段分属 users.read、nodes.read、
        traffic.read、finance.read、invite.read、site.stats.read 六个独立能力。

        **只返回调用者实际持有能力的那几段，其余整块不出现**，并由 `sections` 列出本次包含了哪几段。
        少一段与「那段是 0」必须能区分：首页上一个孤零零的 0 会被读成「今天没单」，
        而真相可能是「没有资金查看权限」。没有的那段连查询都不发。
        一段都没有时返回 40310，而不是一个空壳。

        读取前后各核验一次持有的能力集合；读取期间集合发生变化返回 40310，不交出已缓冲的数字。

        口径：计数一律字符串；流量窗口固定最近 7 天（含今天，UTC 自然日），要自定义区间走
        GET /traffic/stats；`finance.orders_created_today` 的「今天」同样按 UTC 自然日切。
        `users.devices_active` 是未撤销的设备记录数，不是在线会话数；
        `nodes.by_status` 是登记状态，不代表心跳新鲜；`invite.rewards_in_review` 只数 REVIEW
        （PENDING 归 worker，不是待办）。状态分布不硬编码枚举，数据库里有什么就返回什么。

        `site` 按 Asia/Kuala_Lumpur 自然日。pageviews 是限流后的浏览次数（PV），visitors 是 IP 哈希去重（UV）；
        历史访客不是每日访客相加。下载同一哈希、同一通道、同一天只计一次。android_legacy 是旧版安装包，不并进 android。
      responses:
        '200': { description: 概览指标, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } }
        default: { $ref: '#/components/responses/Error' }

  /users:
    get:
      operationId: listUsers
      x-admin-level: L0
      description: |
        需要 users.read。每次请求开始与返回前检查当前会话及实时权限，业务读取使用只读一致性快照。
        精确账户号查询，按 created_at、数字id倒序；不返回认证材料、IP或指纹哈希、风控原始JSON。
        balance单位USDT，固定6位小数字符串；缺少余额记录返回null，不能解释为0。
      parameters:
        - { $ref: '#/components/parameters/UserPage' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: account_no, in: query, schema: { type: string, pattern: '^[1-9][0-9]{9}$' } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, SUSPENDED, BANNED] } }
      responses:
        '200': { description: 用户列表, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedUserList' } } } }
        default: { $ref: '#/components/responses/Error' }
  /users/{id}:
    get:
      operationId: getUser
      x-admin-level: L0
      description: |
        需要 users.read。仅公开业务字段与存储的套餐快照，不返回账户密钥、lookup/hash、会话或设备认证信息。
        subscription不是合算后的连接权限，不包含流量包/设备加购；不存在记录为null。
        无权限统一40310先于目标存在性检查；合法但不存在编号40401。
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: 用户详情, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedUserDetail' } } } }
        default: { $ref: '#/components/responses/Error' }
  /users/{id}/ledgers:
    get:
      operationId: getUserLedgers
      x-admin-level: L0
      description: |
        同时需要 users.read 与 users.ledgers.read。type必填；按created_at与数字id倒序，每页20默认/50最大。
        所有编号及变化量为字符串；余额金额为带符号、固定6位小数USDT字符串。
        仅返回白名单流水字段，不返回原始权益快照、备注、幂等键、operator_id或任何认证信息。
        不存在用户40401；存在但无流水返回空items和total="0"。禁止额外user_id参数和未知/重复查询参数。
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/UserPage' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: type, in: query, required: true, schema: { type: string, enum: [balance, entitlement] } }
      responses:
        '200':
          description: 余额或权益流水
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/ManagedBalanceLedgerPage' }
                  - { $ref: '#/components/schemas/ManagedEntitlementLedgerPage' }
        default: { $ref: '#/components/responses/Error' }
  /users/{id}/devices:
    get:
      operationId: getUserDevices
      x-admin-level: L0
      description: |
        仅需现有 users.read。查询开始与返回前实时核实当前会话和权限，设备总数与结果在同一只读一致性快照中读取。
        仅指定用户的设备记录，按 created_at 与数据库数字 id 倒序；状态可省略，不能传空、未知或重复参数。
        ACTIVE仅表示尚未撤销的绑定记录，不表示在线或当前可连接。created_at是此设备记录首次创建/绑定时间。
        last_seen_at、revoked_at缺失时保留null，不补造时间；最后活跃时间可能因并发记录晚于撤销，不推断在线状态。
        ACTIVE且revoked_at非null的矛盾数据返回脱敏内部错误；REVOKED允许历史撤销时间缺失。
        不返回device_uid、公钥、指纹、IP、型号版本、凭据、会话或风险原文，也不联查认证表。
        无权限先于目标存在性返回40310；合法不存在用户40401；已有用户无设备返回items=[]、total="0"。
        本接口只读，不提供设备移除、会话操作或写入；未知、重复或越界查询参数返回40001。
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/UserPage' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, REVOKED] } }
      responses:
        '200': { description: 指定用户设备分页；Cache-Control no-store, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedDevicePage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /users/{id}/status:
    post:
      operationId: setUserStatus
      x-admin-level: L2
      x-permission: users.status
      x-idempotent: true
      summary: 停用 / 封禁 / 恢复账户
      description: |
        三个状态的实际效果**不一样**，不要混为一谈：

        - `BANNED`：所有已认证的 App 接口一律拒绝（鉴权中间件直接挡掉），等于完全锁死。
        - `SUSPENDED`：仍可登录、仍能看到自己的账户与订单，但**拿不到连接材料**（40305），
          且会从各节点的 peer 清单中消失，节点下次同步后不再为其放行。
        - `ACTIVE`：恢复。

        **都不会立即切断已经建立的隧道。** 效果体现在「下一次取材料 / 下一次节点同步」，
        要立刻断流必须在节点上操作。

        本接口**不吊销登录会话**：SUSPENDED 下用户仍应能查看自己的账户，这是有意的；
        BANNED 则由鉴权中间件拦截，吊销会话并不会让它更严格。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, status, reason]
              properties:
                operation_id: { type: string, format: uuid }
                status: { type: string, enum: [ACTIVE, SUSPENDED, BANNED] }
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '204': { description: 已设置（重复提交同一 operation_id 同样返回 204） }
        '404': { description: 40401 用户不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
  /users/{id}/adjustments:
    post:
      operationId: adjustUser
      x-admin-level: L3
      summary: 手工调整天数/流量/余额/设备数（双人审批）
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, delta, reason]
              properties:
                kind: { type: string, enum: [DAYS, TRAFFIC, BALANCE, DEVICES] }
                delta: { type: string, description: DAYS/DEVICES 为整数，TRAFFIC 为字节，BALANCE 为带符号金额字符串 }
                reason: { type: string }
      responses: { '202': { $ref: '#/components/responses/Approval' }, default: { $ref: '#/components/responses/Error' } }
  /users/{id}/secret-reset:
    post:
      operationId: resetUserSecret
      x-admin-level: L2
      summary: 重置账户密钥（需通过方案 12.4 的所有权核验，新密钥一次性展示）
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ownership_proof, reason], properties: { ownership_proof: { type: object, additionalProperties: true }, reason: { type: string } } } } } }
      responses: { '200': { description: 新密钥 }, default: { $ref: '#/components/responses/Error' } }

  /devices:
    get:
      operationId: listDevices
      x-admin-level: L0
      summary: 设备总览（跨用户只读）
      description: |
        需要 users.read——与 GET /users/{id}/devices 同一个能力、同一套投影，区别只是不先选定用户。
        同样的字段按用户一个一个翻本来就能看全，换个入口不构成新的暴露面，因此不另立 devices.read。
        仍不返回 device_uid、公钥、指纹哈希与任何凭据。

        设备记录不是在线会话：`last_seen_at` 是尽力而为的活跃痕迹，ACTIVE 只表示这条记录还没被撤销。
        `user_id` 为精确匹配；查无此人与此人没有设备在这个入口上一律是空列表，
        不用 404 区分（否则用户是否存在会变成可枚举的信号）。
        筛选值非法一律 400，不静默忽略。按 created_at、id 倒序。
      parameters:
        - { $ref: '#/components/parameters/UserPage' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, REVOKED] } }
        - { name: platform, in: query, schema: { type: string, enum: [ANDROID, IOS] } }
        - { name: user_id, in: query, schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' } }
      responses:
        '200': { description: 设备总览, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedDeviceOverviewPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /devices/{id}:
    delete:
      operationId: revokeDevice
      x-admin-level: L2
      x-idempotent: true
      summary: 撤销指定用户的设备记录及访问凭据（保留历史）
      description: |
        需要 devices.revoke（L2）；二次验证 action_code=devices.revoke，绑定 DELETE、实际完整路径和原始请求体。
        operation_id 是请求体内的规范小写 UUIDv4 幂等键，不使用 Idempotency-Key 头；user_id 必须对应当前确认的用户。
        凭据、全部登录会话/刷新令牌、绑定日志、节点撤销事件和成功审计同事务提交。权限先于目标存在性检查。
        同一管理员相同 operation_id 和完全相同请求返回首次结果，不重复事件或成功审计；不同目标/资料返回409。
        重放仍须有效会话、权限及未到期的二次验证，可使用本操作原令牌或新签发的同请求令牌；原令牌不能授权其他操作。
        节点同步仅登记事件，不代表节点已收到或连接已实时断开。已撤销历史可保留 revoked_at=null，不伪造时间。
        已发送请求遇到超时/网络或未知错误后，请使用精确设备 GET 核实；当前 REVOKED 不证明由本次操作造成。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceRevokeInput' } } } }
      responses:
        '200': { description: 已撤销或相同操作的首次结果；Cache-Control no-store, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceRevokeResult' } } } }
        default: { $ref: '#/components/responses/Error' }
  /users/{id}/devices/{device_id}:
    get:
      operationId: getUserDevice
      x-admin-level: L0
      summary: 精确核实指定用户的设备状态
      description: 需要 users.read；按用户和设备编号同时查找，读取前后实时核实权限及会话。没有查询参数；不返回凭据，不推断当前在线或某次撤销操作是否成功。
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: device_id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' } }
      responses:
        '200': { description: 当前设备状态；Cache-Control no-store, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedDeviceDetail' } } } }
        default: { $ref: '#/components/responses/Error' }

  /users/{id}/devices/{device_id}/receipts:
    get:
      operationId: getUserDeviceRevocationReceipts
      x-admin-level: L0
      summary: 查看该设备的撤销在各节点上的执行回执
      description: >-
        需要 users.read 与 devices.receipts，二者在同一数据库快照内核验，读取前后实时复核权限及会话。
        confirmed 为真的唯一含义是：该节点上报的运行状态校验和与控制面重算的期望清单一致，
        且该设备的全部凭据都不在其中，即「该节点上已不存在这些凭据」。
        confirmed 为假只表示尚未确认，既不表示撤销失败，也不表示凭据仍在生效——
        节点离线、未上报校验和、或尚未收敛都会落在这一侧。本接口不下发任何配置，也不改变任何状态。
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { name: device_id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' } }
      responses:
        '200': { description: 各节点的确认情况；Cache-Control no-store, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceRevocationReceipts' } } } }
        default: { $ref: '#/components/responses/Error' }

  /plans:
    get:
      operationId: listPlans
      x-admin-level: L0
      x-permission: plans.read
      summary: 套餐列表（只读，含草稿与已下架）
      description: |
        返回**全部**套餐——后台要看的正是 App 看不到的那些（DRAFT / OFF_SALE）。
        字节数一律是字符串：套餐配额可以轻松超过 2^53，JSON number 在浏览器里会失精。
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, ON_SALE, OFF_SALE] } }
      responses:
        '200':
          description: 按 sort_order、id 排序
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, observed_at]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ManagedPlan' } }
                  observed_at: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createPlan
      x-admin-level: L2
      x-permission: plans.create
      x-idempotent: true
      summary: 新建套餐（恒为 DRAFT）
      description: |
        **新建的套餐一律是 DRAFT**，上架是另一个动作、另一个权限（`POST /plans/{id}/status`）。

        不属于该类型的字段会被**拒绝**而不是忽略——静默忽略一个填错位置的字段，
        等于让运维以为自己的设置生效了。三种类型各自要求：

        - `TIME`：`duration_days` + `device_limit`，可选 `period_quota_bytes`（省略或 null = 不限量）
        - `TRAFFIC`：`pack_bytes` + `validity_days` + `device_limit`
        - `DEVICE_ADDON`：`extra_devices`

        价格必须是 0.1 USDT 的整数倍（数据库约束）。
      parameters:
        - $ref: '#/components/parameters/StepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanCreate' }
      responses:
        '201':
          description: 已创建（同一 operation_id 重复提交返回首次结果）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedPlan' }
        '409':
          description: 40901 code 已被占用，或同一 operation_id 提交了不同内容
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /plans/{id}:
    patch:
      operationId: updatePlan
      x-admin-level: L2
      x-permission: plans.update
      x-idempotent: true
      summary: 修改套餐（实质改动会作废未结报价）
      description: |
        **真正的部分更新**：没出现的字段保持原样。`period_quota_bytes` 出现且为 `null`
        表示「改成不限量」——这与「没提这个字段」是两件事，本接口按请求体里实际出现的键名区分。

        **`code` 与 `plan_type` 不可修改。** code 是 App 与订单快照引用的稳定标识；
        plan_type 一改，已经引用该套餐的订阅与订单就对不上了——那是一个新套餐，不是改。

        **实质字段变化会让 `version` + 1**：tier、时长、配额、流量包、有效期、设备数、
        加购台数、价格。未使用的报价（plan_quotes）记着报价当时的 plan_version，下单时比对，
        不一致就让用户重新报价——**version 是保护未结报价的那道闸**。改价不 +1，
        10 分钟内已拿到旧报价的用户就会按旧价格买到改过的套餐。

        `name` / `badge` / `sort_order` 只影响展示，**不**改 version，也就不会打断进行中的下单。
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/StepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanPatch' }
      responses:
        '200':
          description: 已修改；实质改动时 version 已 +1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedPlan' }
        '404':
          description: 40401 套餐不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /plans/{id}/status:
    post:
      operationId: setPlanStatus
      x-admin-level: L2
      x-permission: plans.status
      x-idempotent: true
      summary: 套餐上架 / 下架
      description: |
        契约此前把状态写成 `ON_SALE / OFF_SALE / HIDDEN`，与数据库实际允许的取值不一致；
        已按数据库为准改正为 `DRAFT / ON_SALE / OFF_SALE`，其中 **DRAFT 不能作为目标状态**——
        DRAFT 的含义是「从未售卖过」，而上过架的套餐可能已有报价与订单引用它。

        允许的变更：DRAFT→ON_SALE、DRAFT→OFF_SALE、ON_SALE→OFF_SALE、OFF_SALE→ON_SALE。
        重复设置为当前状态是幂等的（204）。

        **下架不影响已购用户**：订阅带着自己的 tier / device_limit / 到期时间，不回查套餐。
        下架只是不再卖，并让未结报价失效（下单时同时校验 `status='ON_SALE'`）。
        本接口**不改 version**——状态本身已经是那道闸。
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/StepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, status, reason]
              properties:
                operation_id: { type: string, format: uuid }
                status: { type: string, enum: [ON_SALE, OFF_SALE] }
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '204':
          description: 已设置（重复提交同一 operation_id 同样返回 204）
        '404':
          description: 40401 套餐不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: 40901 不允许的状态变更
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        default: { $ref: '#/components/responses/Error' }

