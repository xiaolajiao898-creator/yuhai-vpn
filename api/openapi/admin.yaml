        page: { type: integer }
        page_size: { type: integer }
    AuditEntry:
      type: object
      required: [id, action_code, target_type, request_id, result, step_up_verified, created_at, prev_hash, row_hash]
      properties:
        id: { type: string }
        admin_user_id: { type: [string, 'null'] }
        action_code: { type: string }
        target_type: { type: [string, 'null'] }
        target_id: { type: [string, 'null'] }
        approval_id: { type: [string, 'null'] }
        request_id: { type: string }
        result: { type: string, enum: [SUCCESS, FAILED, DENIED] }
        step_up_verified: { type: boolean }
        created_at: { type: string, format: date-time }
        prev_hash: { type: string }
        row_hash: { type: string }
    AuditList:
      type: object
      required: [items, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        total: { type: string }
        page: { type: integer }
        page_size: { type: integer }
    AuditVerification:
      type: object
      required: [valid, from_id, to_id, checked, head_id, head_hash, reason, external_anchor]
      properties:
        valid: { type: boolean }
        from_id: { type: string }
        to_id: { type: string }
        checked: { type: integer }
        head_id: { type: string }
        head_hash: { type: string }
        first_broken_id: { type: [string, 'null'] }
        reason: { type: string }
        external_anchor: { type: boolean, const: false }
    # 原 PlanInput 已按数据库为准重写为 PlanCreate / PlanPatch 两个 schema。
    # 三处与实现对不上的地方在此一并改正，理由写在各自字段上：
    #   - node_group_ids：**全库没有套餐与节点组的任何关联**，节点可见范围由 tier 决定
    #     （node_groups.min_tier）。契约承诺一个不存在的能力比少写一个字段更糟，故删除。
    #   - quota_bytes / period_days：数据库里是 period_quota_bytes（TIME，每 30 天配额）
    #     与 pack_bytes + validity_days（TRAFFIC），原来的两个字段在两种类型间含义不清。
    #   - list_price → price：必须是 0.1 USDT 的整数倍（数据库约束）。
    PlanCreate:
      type: object
      additionalProperties: false
      required: [operation_id, reason, code, name, plan_type, tier, price]
      properties:
        operation_id: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 200 }
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,31}$'
          description: App 与订单快照引用的稳定标识，建好之后不可修改
        name: { type: string, minLength: 1, maxLength: 64 }
        plan_type: { type: string, enum: [TIME, TRAFFIC, DEVICE_ADDON], description: 建好之后不可修改 }
        tier: { type: integer, minimum: 1, maximum: 9, description: 决定可用节点组（node_groups.min_tier） }
        price: { type: string, description: 必须是 0.1 USDT 的整数倍，例如 "9.900000" }
        duration_days: { type: integer, minimum: 1, maximum: 3650, description: 仅 TIME }
        period_quota_bytes:
          type: [string, 'null']
          description: 仅 TIME；每 30 天配额，省略或 null 表示不限量。字符串以免 JSON number 失精
        pack_bytes: { type: [string, 'null'], description: 仅 TRAFFIC }
        validity_days: { type: integer, minimum: 1, maximum: 3650, description: 仅 TRAFFIC }
        device_limit: { type: integer, minimum: 1, maximum: 100, description: 仅 TIME / TRAFFIC }
        extra_devices: { type: integer, minimum: 1, maximum: 100, description: 仅 DEVICE_ADDON }
        badge: { type: [string, 'null'], maxLength: 32 }
        sort_order: { type: integer, minimum: 0, maximum: 100000 }
    PlanPatch:
      type: object
      additionalProperties: false
      required: [operation_id, reason]
      description: 部分更新；未出现的键保持原样。至少要给出一个可改字段。
      properties:
        operation_id: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 64 }
        tier: { type: integer, minimum: 1, maximum: 9 }
        price: { type: string }
        duration_days: { type: integer, minimum: 1, maximum: 3650 }
        period_quota_bytes: { type: [string, 'null'], description: 显式 null = 改成不限量 }
        pack_bytes: { type: [string, 'null'] }
        validity_days: { type: integer, minimum: 1, maximum: 3650 }
        device_limit: { type: integer, minimum: 1, maximum: 100 }
        extra_devices: { type: integer, minimum: 1, maximum: 100 }
        badge: { type: [string, 'null'] }
        sort_order: { type: integer, minimum: 0, maximum: 100000 }
    ManagedPlan:
      type: object
      additionalProperties: false
      required: [id, code, name, plan_type, tier, duration_days, period_quota_bytes, pack_bytes,
                 validity_days, device_limit, extra_devices, price, badge, sort_order, status,
                 version, created_at, updated_at]
      properties:
        id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        code: { type: string }
        name: { type: string }
        plan_type: { type: string, enum: [TIME, TRAFFIC, DEVICE_ADDON] }
        tier: { type: integer }
        duration_days: { type: [integer, 'null'] }
        period_quota_bytes: { type: [string, 'null'], description: null 表示不限量 }
        pack_bytes: { type: [string, 'null'] }
        validity_days: { type: [integer, 'null'] }
        device_limit: { type: [integer, 'null'] }
        extra_devices: { type: [integer, 'null'] }
        price: { type: string, description: 固定 6 位小数 }
        badge: { type: [string, 'null'] }
        sort_order: { type: integer }
        status: { type: string, enum: [DRAFT, ON_SALE, OFF_SALE] }
        version: { type: integer, description: 实质改动才 +1；未结报价靠它作废 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RedeemCardType:
      type: object
      additionalProperties: false
      required: [code, name, duration_days, tier, device_limit, unlimited_traffic, enabled]
      properties:
        code: { type: string }
        name: { type: string }
        duration_days: { type: integer }
        tier: { type: integer }
        device_limit: { type: integer }
        unlimited_traffic: { type: boolean }
        enabled: { type: boolean }
    RedeemCode:
      type: object
      additionalProperties: false
      required: [id, hint, batch_id, card_type, card_name, duration_days, tier, device_limit, unlimited_traffic, note, status, created_by, created_at, redeemed_by, redeemed_account_no, redeemed_at]
      properties:
        id: { type: string }
        hint: { type: string, description: 掩码，只有后四位 }
        batch_id: { type: string }
        card_type: { type: string }
        card_name: { type: string }
        duration_days: { type: integer }
        tier: { type: integer }
        device_limit: { type: integer }
        unlimited_traffic: { type: boolean }
        note: { type: string }
        status: { type: string, enum: [unused, used, revoked] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        redeemed_by: { type: [string, 'null'] }
        redeemed_account_no: { type: [string, 'null'] }
        redeemed_at: { type: [string, 'null'], format: date-time }
    RedeemGenerate:
      type: object
      additionalProperties: false
      required: [operation_id, card_type, quantity]
      properties:
        operation_id: { type: string, format: uuid }
        card_type: { type: string, enum: [WEEK, MONTH, YEAR] }
        quantity: { type: integer, minimum: 1, maximum: 500 }
        note: { type: string, maxLength: 200 }
    RedeemReason:
      type: object
      additionalProperties: false
      required: [operation_id, reason]
      properties:
        operation_id: { type: string, format: uuid }
        reason: { type: string, minLength: 1, maxLength: 500 }
    RedeemBatch:
      type: object
      additionalProperties: false
      required: [batch_id, card_type, card_name, quantity, duration_days, tier, device_limit, unlimited_traffic, note, created_at, codes]
      properties:
        batch_id: { type: string }
        card_type: { type: string }
        card_name: { type: string }
        quantity: { type: integer }
        duration_days: { type: integer }
        tier: { type: integer }
        device_limit: { type: integer }
        unlimited_traffic: { type: boolean }
        note: { type: string }
        created_at: { type: string, format: date-time }
        codes: { type: array, items: { type: string } }
    RedeemExport:
      type: object
      additionalProperties: false
      required: [batch_id, card_type, card_name, note, codes]
      properties:
        batch_id: { type: string }
        card_type: { type: string }
        card_name: { type: string }
        note: { type: string }
        codes:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, status]
            properties:
              code: { type: string }
              status: { type: string, enum: [unused, used, revoked] }
    RedeemRevoke:
      type: object
      additionalProperties: false
      required: [id, batch_id, status]
      properties:
        id: { type: string }
        batch_id: { type: string }
        status: { type: string, enum: [revoked] }
