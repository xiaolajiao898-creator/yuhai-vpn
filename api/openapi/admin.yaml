      description: 严格拒绝未知、重复和空查询参数。读取前后实时核验 nodes.read；只读一致快照。心跳新鲜不代表实际隧道可用，在线数与负载为最后上报值。
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: search, in: query, schema: { type: string, minLength: 1, maxLength: 64 }, description: 节点名称的不区分大小写字面子串；不展开百分号或下划线通配符 }
        - { name: status, in: query, schema: { type: string, enum: [ONLINE, OFFLINE, MAINTENANCE, DISABLED] } }
        - { name: country_code, in: query, schema: { type: string, pattern: '^[A-Z]{2}$' } }
