        - { name: protocol, in: query, schema: { type: string } }
        - { name: country_code, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string, maxLength: 64 } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        default: { $ref: '#/components/responses/Error' }
  /egress/import/preview:
    post:
      operationId: previewEgressImport
      x-admin-level: L1
      x-permission: egress.write
      summary: |
        解析导入内容并逐行报错，不落库。支持 IP:端口:账号:密码、user:pass@host:port、socks5/http/https/ss/trojan/
        vless/vmess/hysteria2 分享链接、base64 订阅正文、CSV（带表头）与 JSON。回显只含脱敏片段。
        拒绝任何关闭 TLS 校验的写法（allowInsecure/insecure），TUIC 等当前内核不支持的协议逐行报错。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EgressImportInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        default: { $ref: '#/components/responses/Error' }
  /egress/import:
    post:
      operationId: importEgress
