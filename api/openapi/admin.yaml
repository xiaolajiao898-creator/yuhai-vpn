        绑定 POST、实际完整路径和原始请求体；operation_id 幂等。

        写入的 `auto_detected` 恒为 false——人工登记与扫描自动识别混在一起，
        事后就说不清某个地址是谁认定的。地址重复返回 40901。

        **本系统自己的收款地址一律拒绝登记**：它是收钱的一端，不是别人付款的来源；
        标错之后凡是查到这个地址的风控判断都会走偏。

        注意：契约里**没有删除接口**，登记错了目前只能连库处理。需要的话应当另行补上。
      parameters: [ { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, reason, address]
              properties:
                operation_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 255 }
                address: { type: string, minLength: 1, maxLength: 64 }
                note: { type: string, maxLength: 128 }
      responses:
        '201': { description: 已登记；Cache-Control no-store, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedSharedPayAddress' } } } }
        default: { $ref: '#/components/responses/Error' }

  /blacklist:
    get:
      operationId: listBlacklist
      x-admin-level: L0
      x-permission: risk.read
      summary: 黑名单列表（只读）
      description: |
        **重要：黑名单当前只在邀请链路生效。** 命中它会拦下邀请绑定与邀请奖励，
        但**不会**阻止登录、下单或连接——不要指望加一条黑名单就能把某人挡在门外。
        代码里实际读取它的只有 `internal/invite/bind.go` 与 `risk_rewards.go` 两处。
        USER 与 INVITE_CODE 两类目标无条件生效；DEVICE / FINGERPRINT / IP_PREFIX
        还要求 effects 与 `INVITE_BIND` / `INVITE_REWARD` / `ALL` 有交集。
      parameters:
        - $ref: '#/components/parameters/Page'
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, REMOVED] } }
        - { name: target_type, in: query, schema: { type: string, enum: [USER, DEVICE, FINGERPRINT, PAY_ADDRESS, IP_PREFIX, INVITE_CODE] } }
      responses:
        '200':
          description: 按 created_at、id 倒序
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total, page, page_size, observed_at]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ManagedBlacklistEntry' } }
                  total: { type: string, pattern: '^(0|[1-9][0-9]{0,18})$' }
                  page: { type: integer }
                  page_size: { type: integer }
                  observed_at: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: addBlacklist
      x-admin-level: L2
      x-permission: risk.blacklist_add
      x-idempotent: true
      summary: 新增黑名单条目（只影响邀请链路）
      description: |
        契约此前把 target_type 写成 `DEVICE_FINGERPRINT`，与数据库实际允许的取值不一致；
        已按数据库为准改正为 DEVICE / FINGERPRINT 两类，并补上 INVITE_CODE。

        `effects` 只接受 `INVITE_BIND` / `INVITE_REWARD` / `ALL`——这是代码里真正会检查的三个值。
        写入一个没有任何地方会读的 effect 等于给运维一个假的安全感，因此一律拒绝。
      parameters: [ { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, target_type, target_value, effects, reason]
              properties:
                operation_id: { type: string, format: uuid }
                target_type: { type: string, enum: [USER, DEVICE, FINGERPRINT, PAY_ADDRESS, IP_PREFIX, INVITE_CODE] }
                target_value: { type: string, minLength: 1, maxLength: 128 }
                effects:
                  type: array
                  minItems: 1
                  maxItems: 3
                  items: { type: string, enum: [INVITE_BIND, INVITE_REWARD, ALL] }
                reason: { type: string, minLength: 1, maxLength: 200 }
                expires_at: { type: [string, 'null'], format: date-time, description: 留空表示长期有效 }
      responses:
        '201':
          description: 已新增（同一 operation_id 重复提交返回首次结果）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedBlacklistEntry' }
        '409': { description: 40901 同一目标已有生效条目，或同一 operation_id 提交了不同内容, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
  /blacklist/{id}:
    delete:
      operationId: removeBlacklist
      x-admin-level: L2
      x-permission: risk.blacklist_remove
      x-idempotent: true
      summary: 解除黑名单条目
      description: |
        置为 REMOVED 并记录操作人与时间，**不删除记录**——风控处置需要留痕。
        已解除的条目再次解除返回同样的结果（幂等）。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, reason]
              properties:
                operation_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '204': { description: 已解除（重复解除同样返回 204） }
        '404': { description: 40401 条目不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }

  /approvals:
    get:
      operationId: listApprovals
      x-admin-level: L0
      description: 需要 approvals.read；pending 为仍有效且非本人发起的待审批项。过期以 EXPIRED 展示。
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: scope, in: query, schema: { type: string, enum: [all, mine, pending], default: pending } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ApprovalStatus' } }
      responses:
        '200': { description: 审批分页, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalList' } } } }
        default: { $ref: '#/components/responses/Error' }
  /approvals/{id}:
    get:
      operationId: getApproval
      x-admin-level: L0
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      description: 需要 approvals.read；仅支持的版本发布动作返回公开字段快照，未知动作不返回原始 payload。
      responses:
        '200': { description: 审批详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDetail' } } } }
        default: { $ref: '#/components/responses/Error' }
  /approvals/{id}/approve:
    post:
      operationId: approveApproval
      x-admin-level: L2
      description: |
        需要 approvals.decide 与目标动作权限 app_versions.publish；二次验证 action_code=approvals.decide。
        审批人不能是发起人（40907），作者仍须有效且有发布权限。仅 app_versions.publish 执行器可用。
        实际请求哈希、审批快照和当前数据重新校验；数据变化返回40908，24小时过期拒绝。
        二次验证消耗、发布、审批终态与审计同一事务；锁定审批行防重复执行，未知执行器拒绝执行。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false } } } }
      responses:
        '200': { description: 已执行审批详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDetail' } } } }
        default: { $ref: '#/components/responses/Error' }
  /approvals/{id}/reject:
    post:
      operationId: rejectApproval
      x-admin-level: L2
      description: 需要 approvals.decide；二次验证 action_code=approvals.decide。不可自审，理由持久保存，状态及审计同事务。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [note], properties: { note: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses:
        '200': { description: 已拒绝审批详情, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDetail' } } } }
        default: { $ref: '#/components/responses/Error' }
  /audit-logs:
    get:
      operationId: listAuditLogs
      x-admin-level: L0
      description: 需要 audit.read；列表不暴露IP、浏览器信息与前后快照。只追加哈希链，未接外部WORM锚点。
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: action, in: query, schema: { type: string, maxLength: 64 } }
        - { name: result, in: query, schema: { type: string, enum: [SUCCESS, FAILED, DENIED] } }
      responses:
        '200': { description: 审计分页, content: { application/json: { schema: { $ref: '#/components/schemas/AuditList' } } } }
        default: { $ref: '#/components/responses/Error' }
  /audit-logs/verify:
    post:
      operationId: verifyAuditChain
      x-admin-level: L0
      description: 需要 audit.read 和 CSRF；固定数据库快照校验区间及前驱，最多10000条，ID跳号本身不视为损坏。
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [from_id, to_id], properties: { from_id: { type: string, pattern: '^[1-9][0-9]*$' }, to_id: { type: string, pattern: '^[1-9][0-9]*$' } } } } } }
      responses:
        '200': { description: 校验结果, content: { application/json: { schema: { $ref: '#/components/schemas/AuditVerification' } } } }
        default: { $ref: '#/components/responses/Error' }

  /configs/{key}:
    patch:
      operationId: updateConfig
      x-admin-level: L2
      x-permission: configs.write
      x-idempotent: true
      summary: 修改系统参数
      description: |
        需要 configs.write（L2）；二次验证 action_code=configs.write，绑定 PATCH、实际完整路径和原始请求体。
        operation_id 是请求体内的规范小写 UUIDv4 幂等键；同一 operation_id 换请求体或换操作一律 40901，
        重放返回与首次逐字节相同的响应。

        **key 走白名单**，只接受代码真正会读取的那几个参数：`order.cooldown_seconds`、
        `topup.min_micro`、`topup.max_micro`、`invite.reward_default_plan_code`、
        `invite.reward_traffic_plan_code`、`trial.enabled`。白名单之外一律 40001，**包括数据库里已经存在的键**——
        能写一个没有读取方的键，等于给运维一个「改了但不生效」的按钮。

        值按 key 逐个校验，两处是重点：

        - `topup.min_micro` 与 `topup.max_micro` 是一对。单独改一个足以把区间改成空集，
          而下单只会报「金额不在范围内」，没人会想到是配置写反了。因此改任一个都会在同一事务里
          取另一个的现值一起校验，min > max 返回 40001。另一端从未配过时放行（读取方会退回内置默认值）。
        - `invite.reward_*_plan_code` 用**与发放侧完全相同的一套判断**校验：套餐必须存在、ON_SALE、
          类型匹配且本身合法。不满足时返回 40001——写进去不会报错，只会在发奖励时静默不发。

        整值替换，不是合并：这些键存的是标量。类型不符一律拒绝而不是转换——`"3600"`（字符串）
        不会被当成 3600。key 尚未配置过时写入第一条并返回 `created: true`，不是 404。
        version 每次写入 +1。
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, maxLength: 64 } }
        - { $ref: '#/components/parameters/StepUp' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, reason, value]
              properties:
                operation_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 255 }
                value: { description: 标量值；类型由 key 决定（整数或套餐编号字符串） }
      responses:
        '200': { description: 已写入；Cache-Control no-store, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedConfig' } } } }
        default: { $ref: '#/components/responses/Error' }
  /admins:
    get:
      operationId: listAdmins
      x-admin-level: L0
      description: 需要 admins.read；分页返回管理员与完整角色目录，不返回密码、TOTP、IP 或会话材料。username 为精确匹配；Cache-Control no-store。
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: username, in: query, schema: { type: string, maxLength: 32 } }
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, LOCKED, DISABLED] } }
      responses:
        '200': { description: 管理员列表及可供选择的角色目录, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedAdminPage' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createAdmin
      x-admin-level: L3
      description: |
        需要 admins.create + 二次验证 + 另一名管理员审批，返回 202 仅代表建立申请。
        用户名为小写字母开头的 3–32 位字母、数字、下划线、点或短横线。
        初始密码及新管理员已配置的 TOTP 种子只在请求中提供；必须同时提供该种子的当前六位验证码。
        审批暂存凭据经过加密，审批详情与审计只展示用户名和角色，不含凭据。
        发起人和审批人均须持有所分配角色的全部权限；执行时重新核验角色快照与双方权限。
        operation_id 为 UUIDv4；同一会话相同请求可安全重放，冲突请求返回 40901。
        本接口不创建默认账号，不授予调用者当前没有的权限。
      parameters: [ { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, reason, username, password, totp_secret, totp_code, role_ids]
              properties:
                operation_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500 }
                username: { type: string, pattern: '^[a-z][a-z0-9_.-]{2,31}$' }
                password: { type: string, minLength: 12, maxLength: 1024, writeOnly: true }
                totp_secret: { type: string, minLength: 32, maxLength: 103, writeOnly: true, description: RFC4648 大写 Base32 无填充，解码后 20–64 字节 }
                totp_code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
                role_ids: { type: array, minItems: 1, maxItems: 20, uniqueItems: true, items: { type: string, pattern: '^[1-9][0-9]*$' } }
      responses:
        '202': { $ref: '#/components/responses/Approval' }
        default: { $ref: '#/components/responses/Error' }
  /admins/{id}/roles:
    put:
      operationId: setAdminRoles
      x-admin-level: L3
      description: |
        需要 admins.roles + 二次验证 + 双人审批；以 role_ids 替换全部角色（空数组表示撤销全部权限）。
        发起人不能修改自己的角色；目标管理员不能审批自己的角色变更。
        发起人和审批人均须持有目标现有及新角色的全部权限；角色定义或目标当前角色在等待期间变化则 40908。
        执行与目标全部会话失效、审批状态和审计同事务。不可借此解锁或启用禁用账号。
        operation_id 为 UUIDv4；相同会话相同请求幂等，冲突请求返回 40901。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, reason, role_ids]
              properties:
                operation_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 500 }
                role_ids: { type: array, maxItems: 20, uniqueItems: true, items: { type: string, pattern: '^[1-9][0-9]*$' } }
      responses:
        '202': { $ref: '#/components/responses/Approval' }
        default: { $ref: '#/components/responses/Error' }
  /app-versions:
    get:
      operationId: listAppVersions
      x-admin-level: L0
      description: 需要 app_versions.read。按创建时间和数字编号倒序；version_code 为精确匹配且必须同时传 platform，可用于网络不明后的只读核实。
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
        - { name: platform, in: query, schema: { type: string, enum: [ANDROID, IOS] } }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, PUBLISHED, WITHDRAWN] } }
        - { name: version_code, in: query, schema: { type: string, pattern: '^[1-9][0-9]{0,9}$' } }
      responses:
        '200': { description: 版本列表, content: { application/json: { schema: { $ref: '#/components/schemas/AppVersionList' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createAppVersion
      x-admin-level: L2
      description: |
        需要 app_versions.draft；二次验证 action_code=app_versions.draft，绑定 POST 方法、实际完整路径和原始请求体。
        仅新建完整 DRAFT，不发布、不上传或下载文件。最大请求24KB，release_notes最大16000 UTF-8字节。
        operation_id 为客户端UUIDv4；同一管理员相同操作只落库一次，冲突内容返回40901。
        网络不明不得自动重试；通过平台和版本号精确查询核实。明确重新提交也需要新的二次验证令牌；已消费令牌不可复用。
        相同操作重放仅在原请求及结果快照均未变化时返回原目标，否则40901并应重新查询。
      parameters: [ { $ref: '#/components/parameters/StepUp' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AppVersionCreate' } } } }
      responses:
        '201': { description: 已保存草稿, content: { application/json: { schema: { $ref: '#/components/schemas/AppVersionDetail' } } } }
        default: { $ref: '#/components/responses/Error' }
  /app-versions/{id}:
    get:
      operationId: getAppVersion
      x-admin-level: L0
      description: 需要 app_versions.read；只返回当前版本公开发布字段，不读取安装包内容。
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: 版本详情, content: { application/json: { schema: { $ref: '#/components/schemas/AppVersionDetail' } } } }
        default: { $ref: '#/components/responses/Error' }
    put:
      operationId: updateAppVersion
      x-admin-level: L2
      description: |
        需要 app_versions.draft；二次验证 action_code=app_versions.draft，绑定 PUT、实际完整路径及原始请求体。
        全量替换DRAFT公开发布字段。expected_snapshot_hash必须等于最近GET详情的snapshot_hash，否则40908。
        存在未过期PENDING发布审批、非DRAFT或平台版本号冲突返回40901。不会修改已有审批或已发布版本。
        operation_id、请求上限、幂等和网络不明核实规则与新建一致。已消费step-up令牌不可复用。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AppVersionUpdate' } } } }
      responses:
        '200': { description: 已保存草稿, content: { application/json: { schema: { $ref: '#/components/schemas/AppVersionDetail' } } } }
        default: { $ref: '#/components/responses/Error' }
  /app-versions/{id}/publish:
    post:
      operationId: publishAppVersion
      x-admin-level: L3
      description: |
        需要 app_versions.publish；二次验证 action_code=app_versions.publish。仅对有效 DRAFT 创建24小时审批，不直接发布。
        同一发起人对同一草稿和相同理由的重复申请复用已有有效PENDING审批；草稿快照变化返回40908。
        金额与奖励执行器未接入，此接口不启用奖励，也不上传或生成安装包。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [reason], properties: { reason: { type: string, minLength: 1, maxLength: 500 } } } } } }
      responses:
        '202': { description: 版本发布审批, content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalDetail' } } } }
        default: { $ref: '#/components/responses/Error' }

  /dev/mock-deposit:
