      summary: 提交导入（服务端重新解析，不信任预览结果）；按指纹去重，已存在默认跳过、可选更新；默认导入为停用
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EgressImportInput' } } } }
      responses:
        '201': { description: 已处理（逐行结果，脱敏）, content: { application/json: { schema: { type: object } } } }
        '409': { description: 40901 operation_id 已用于不同请求, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
  /egress/{id}:
    patch:
      operationId: updateEgress
      x-admin-level: L1
      x-permission: egress.write
      x-idempotent: true
      summary: 修改出口的名称/地区/等级/排序/启停；只有 SOCKS5 可标注是否支持 UDP。凭据只能通过重新导入更新
      parameters: [ { name: id, in: path, required: true, schema: { type: string, pattern: '^e[1-9][0-9]*$' } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id]
              properties:
                operation_id: { type: string, format: uuid }
                name: { type: string }
                status: { type: string, enum: [ENABLED, DISABLED] }
                country_code: { type: string }
                city: { type: string }
                region: { type: string }
                min_tier: { type: integer, minimum: 1, maximum: 9 }
                sort_order: { type: integer }
                supports_udp: { type: boolean }
                capacity_users: { type: integer, minimum: 0, maximum: 1000000, description: 0 表示不设上限。出口没有心跳，这个数字不是在线人数。 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        default: { $ref: '#/components/responses/Error' }
  /egress-subscriptions:
    get:
      operationId: listEgressSubscriptions
      x-admin-level: L0
      x-permission: egress.read
      summary: 订阅列表（只显示订阅主机名，订阅地址加密保存、从不返回）
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createEgressSubscription
      x-admin-level: L1
      x-permission: egress.write
      x-idempotent: true
      summary: 登记订阅（只允许 https、默认端口、公网地址；不带任何后台凭据）
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EgressSubscriptionInput' } } } }
      responses:
        '201': { description: 已登记, content: { application/json: { schema: { type: object } } } }
        default: { $ref: '#/components/responses/Error' }
  /egress-subscriptions/preview:
    post:
      operationId: previewEgressSubscription
      x-admin-level: L1
      x-permission: egress.write
      summary: 抓取并解析订阅，不落库。每次实际连接都校验目标 IP（防 DNS 重绑定），拒绝重定向，限 15 秒/2MB
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EgressSubscriptionInput' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        default: { $ref: '#/components/responses/Error' }
  /egress-subscriptions/{id}/refresh:
    post:
      operationId: refreshEgressSubscription
      x-admin-level: L1
      x-permission: egress.write
      x-idempotent: true
      summary: 抓取订阅并按指纹新建/更新；订阅里消失的条目停用（disable_missing 默认开）。抓取失败不改动任何出口
      parameters: [ { name: id, in: path, required: true, schema: { type: string, pattern: '^s[1-9][0-9]*$' } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id]
              properties:
                operation_id: { type: string, format: uuid }
                enable: { type: boolean }
                disable_missing: { type: boolean }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        default: { $ref: '#/components/responses/Error' }

  /redeem-card-types:
    get:
      operationId: listRedeemCardTypes
      x-admin-level: L0
      x-permission: redeem_codes.read
      summary: 当前可生成的卡类型
      description: |
        期限以 redeem_card_types 为准。改天数、等级、设备或流量只影响之后生成的码，已发出的码用生成时的快照。
      responses:
        '200':
          description: 仅返回仍启用的类型，按天数排序
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RedeemCardType' }
        default: { $ref: '#/components/responses/Error' }
  /redeem-codes:
    get:
      operationId: listRedeemCodes
      x-admin-level: L0
      x-permission: redeem_codes.read
      summary: 兑换码列表（不含明文）
      description: |
        只返回掩码（后四位）。明文只在生成和导出的响应里出现，库中保存的是哈希和字段加密后的副本。
      parameters:
        - { name: card_type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [unused, used, revoked] } }
        - { name: batch_id, in: query, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
        - { name: note, in: query, schema: { type: string, maxLength: 200 } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 按编号倒序
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total, page, page_size, observed_at]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RedeemCode' } }
                  total: { type: string }
                  page: { type: integer }
                  page_size: { type: integer }
                  observed_at: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
  /redeem-codes/batches:
    post:
      operationId: generateRedeemCodes
      x-admin-level: L2
      x-permission: redeem_codes.generate
      x-idempotent: true
      summary: 生成一批一次性兑换码
      description: |
        周卡、月卡、年卡走同一个接口，用 card_type 区分（WEEK / MONTH / YEAR）。
        数量 1–500。备注可选，例如发给谁。

        响应里的 codes 是这批明文，请立即复制或下载。同一 operation_id 重放会再次返回这批明文，不会生成第二批。
        换请求体则 40901。审计快照不含明文。
      parameters:
        - $ref: '#/components/parameters/StepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemGenerate' }
      responses:
        '201':
          description: 已生成。codes 仅此响应和导出接口可见
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeemBatch' }
        default: { $ref: '#/components/responses/Error' }
  /redeem-codes/batches/{id}/export:
    post:
      operationId: exportRedeemCodes
      x-admin-level: L2
      x-permission: redeem_codes.export
      x-idempotent: true
      summary: 再次导出一批兑换码的明文
      description: 需要二次验证。用于生成响应丢失后补救。已使用和已作废的码也会列出，并带上状态。
      parameters:
        - $ref: '#/components/parameters/StepUp'
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemReason' }
      responses:
        '200':
          description: 明文和当前状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeemExport' }
        default: { $ref: '#/components/responses/Error' }
  /redeem-codes/{id}/revoke:
    post:
      operationId: revokeRedeemCode
      x-admin-level: L2
      x-permission: redeem_codes.revoke
      x-idempotent: true
      summary: 作废一张未使用的兑换码
      description: 已使用或已作废的码不能再次作废。与兑换使用同一行锁，避免一边开通一边作废。
      parameters:
        - $ref: '#/components/parameters/StepUp'
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[1-9][0-9]*$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RedeemReason' }
      responses:
        '200':
          description: 已作废
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RedeemRevoke' }
        default: { $ref: '#/components/responses/Error' }

components:
  parameters:
    UserPage:
      name: page
      in: query
      schema: { type: integer, minimum: 1, maximum: 10000, default: 1 }
    Id: { name: id, in: path, required: true, schema: { type: string } }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    StepUp:
      name: X-Step-Up-Token
      in: header
      required: true
      description: L2/L3 操作必需；由 POST /step-up 签发，绑定 action_code 与 payload_hash
      schema: { type: string }
  responses:
    Error:
      description: 错误（40110 需二级验证 / 40111 令牌无效 / 40112 TOTP 错误 / 40310 权限不足 / 40907 / 40908）
      content:
        application/json:
          schema:
            type: object
            required: [error, request_id]
            properties:
              error: { type: object, required: [code, message], properties: { code: { type: integer }, message: { type: string } } }
              request_id: { type: string }
    Approval:
      description: 已创建审批单，等待另一名管理员审批（24 小时未处理自动过期）
      content:
        application/json:
          schema: { type: object, required: [approval_id], properties: { approval_id: { type: string } } }
  schemas:
    EgressImportInput:
      type: object
      additionalProperties: false
      properties:
        operation_id: { type: string, format: uuid, description: 提交导入时必填 }
        text: { type: string, maxLength: 1048576 }
        default_protocol: { type: string, enum: [SOCKS5, HTTP, HTTPS] }
        default_udp: { type: boolean, description: SOCKS5 代理端是否支持 UDP ASSOCIATE }
        country_code: { type: string }
        city: { type: string }
        region: { type: string }
        name_prefix: { type: string }
        min_tier: { type: integer, minimum: 1, maximum: 9 }
        enable: { type: boolean, description: 导入后直接启用（默认停用） }
        update_existing: { type: boolean, description: 指纹已存在时更新凭据与参数（默认跳过） }
    EgressSubscriptionInput:
      type: object
      additionalProperties: false
      properties:
        operation_id: { type: string, format: uuid }
        name: { type: string }
        url: { type: string, description: https 订阅地址（加密保存） }
        default_protocol: { type: string, enum: [SOCKS5, HTTP, HTTPS] }
        country_code: { type: string }
        region: { type: string }
        min_tier: { type: integer, minimum: 1, maximum: 9 }
    ErrorEnvelope:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: integer }
            message: { type: string }
        request_id: { type: string }
    ManagedAdmin:
      type: object
      additionalProperties: false
      required: [id, username, status, role_ids, created_at, updated_at, last_login_at]
      properties:
        id: { type: string }
        username: { type: string }
        status: { type: string, enum: [ACTIVE, LOCKED, DISABLED] }
        role_ids: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }
    ManagedAdminRole:
      type: object
      additionalProperties: false
      required: [id, code, name, permissions]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        permissions: { type: array, items: { type: string } }
    ManagedAdminPage:
      type: object
      additionalProperties: false
      required: [items, roles, total, page, page_size]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ManagedAdmin' } }
        roles: { type: array, items: { $ref: '#/components/schemas/ManagedAdminRole' } }
        total: { type: string }
        page: { type: integer }
        page_size: { type: integer }
    ManagedSharedPayAddress:
      type: object
      additionalProperties: false
      required: [address, note, auto_detected, created_at]
      properties:
        address: { type: string, maxLength: 64 }
        note: { type: [string, 'null'], maxLength: 128 }
        auto_detected: { type: boolean }
        created_at: { type: string, format: date-time }
    ManagedSharedPayAddressPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size, observed_at]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ManagedSharedPayAddress' } }
        total: { type: string, pattern: '^[0-9]{1,20}$' }
        page: { type: integer }
        page_size: { type: integer }
        observed_at: { type: string, format: date-time }
    ManagedReceiveAddressStatus:
      type: object
      additionalProperties: false
      required: [id, network, address, status, previous_status, valid_until, active_remaining, updated_at]
      properties:
        id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        network: { type: string, enum: [TRON, MOCK] }
        address: { type: string, maxLength: 64 }
        status: { type: string, enum: [ACTIVE, PAUSED, RETIRED] }
        previous_status: { type: string, enum: [ACTIVE, PAUSED, RETIRED] }
        valid_until: { type: string, format: date-time }
        active_remaining: { type: string, pattern: '^[0-9]{1,20}$', description: 本次改动后仍可用的收款地址数量 }
        updated_at: { type: string, format: date-time }
    ManagedInviteRule:
      type: object
      additionalProperties: false
      required: [id, name, trigger_event, beneficiary, reward_type, reward_value,
                 reward_percent_bp, min_order_amount_micro, freeze_hours, daily_cap_per_inviter,
                 status, starts_at, ends_at, version, updated_at]
      properties:
        id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        name: { type: string, maxLength: 64 }
        trigger_event: { type: string, enum: [INVITEE_REGISTERED, INVITEE_FIRST_PAID, INVITEE_PAID] }
        beneficiary: { type: string, enum: [INVITER, INVITEE] }
        reward_type: { type: string, enum: [DAYS, TRAFFIC, BALANCE] }
        reward_value: { type: string, pattern: '^[0-9]{1,19}$', description: 单位随 reward_type 变（天 / 字节 / micro） }
        reward_percent_bp: { type: [integer, 'null'] }
        min_order_amount_micro: { type: [string, 'null'], pattern: '^[0-9]{1,19}$' }
        freeze_hours: { type: integer }
        daily_cap_per_inviter: { type: [integer, 'null'] }
        status: { type: string, enum: [ENABLED, DISABLED] }
        starts_at: { type: [string, 'null'], format: date-time }
        ends_at: { type: [string, 'null'], format: date-time }
        version: { type: string, pattern: '^[1-9][0-9]{0,9}$' }
        updated_at: { type: string, format: date-time }
    ManagedConfig:
      type: object
      additionalProperties: false
      required: [key, value, version, created, updated_at]
      properties:
        key: { type: string, maxLength: 64 }
        value: { description: 规范化后的值 }
        version: { type: string, pattern: '^[1-9][0-9]{0,9}$' }
        created: { type: boolean, description: 本次是否是该 key 的第一条记录 }
        updated_at: { type: string, format: date-time }
    Dashboard:
      type: object
      additionalProperties: false
      description: sections 列出本次实际包含的段；未列出的段不在响应里，不能当成 0。
      required: [sections, observed_at]
      properties:
        sections: { type: array, items: { type: string, enum: [users, nodes, traffic, finance, invite, site] } }
        users:
          type: object
          additionalProperties: false
          required: [by_status, devices_active]
          properties:
            by_status: { type: object, additionalProperties: { type: string, pattern: '^[0-9]{1,20}$' } }
            devices_active: { type: string, pattern: '^[0-9]{1,20}$' }
        nodes:
          type: object
          additionalProperties: false
          required: [by_status]
          properties:
            by_status: { type: object, additionalProperties: { type: string, pattern: '^[0-9]{1,20}$' } }
        traffic:
          type: object
          additionalProperties: false
          required: [window_days, from, to, upload_bytes, download_bytes, total_bytes]
          properties:
            window_days: { type: integer }
            from: { type: string, format: date }
            to: { type: string, format: date }
            upload_bytes: { type: string, pattern: '^[0-9]{1,20}$' }
            download_bytes: { type: string, pattern: '^[0-9]{1,20}$' }
            total_bytes: { type: string, pattern: '^[0-9]{1,20}$' }
        finance:
          type: object
          additionalProperties: false
          required: [orders_created_today, deposit_exceptions_open]
          properties:
            orders_created_today: { type: string, pattern: '^[0-9]{1,20}$' }
            deposit_exceptions_open: { type: string, pattern: '^[0-9]{1,20}$' }
        invite:
          type: object
          additionalProperties: false
          required: [rewards_in_review]
          properties:
            rewards_in_review: { type: string, pattern: '^[0-9]{1,20}$' }
        site:
          type: object
          additionalProperties: false
          required: [timezone, pageviews, visitors, downloads]
          properties:
            timezone: { type: string, const: "Asia/Kuala_Lumpur" }
            pageviews:
              type: object
              additionalProperties: false
              required: [today, history]
              properties:
                today: { type: string, pattern: '^[0-9]{1,20}$' }
                history: { type: string, pattern: '^[0-9]{1,20}$' }
            visitors:
              type: object
              additionalProperties: false
              required: [today, history]
              properties:
                today: { type: string, pattern: '^[0-9]{1,20}$' }
                history: { type: string, pattern: '^[0-9]{1,20}$' }
            downloads:
              type: object
              additionalProperties: false
              required: [android, windows, android_legacy]
              properties:
                android: { $ref: '#/components/schemas/DashboardSiteDownload' }
                windows: { $ref: '#/components/schemas/DashboardSiteDownload' }
                android_legacy: { $ref: '#/components/schemas/DashboardSiteDownload' }
        observed_at: { type: string, format: date-time }
    DashboardSiteDownload:
      type: object
      additionalProperties: false
      required: [today, week, month, previous_month, history]
      properties:
        today: { type: string, pattern: '^[0-9]{1,20}$' }
        week: { type: string, pattern: '^[0-9]{1,20}$' }
        month: { type: string, pattern: '^[0-9]{1,20}$' }
        previous_month: { type: string, pattern: '^[0-9]{1,20}$' }
        history: { type: string, pattern: '^[0-9]{1,20}$' }
    ManagedDeviceOverviewPage:
      type: object
      additionalProperties: false
      required: [items, total, page, page_size, observed_at]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [user_id, id, platform, display_name, status, created_at, last_seen_at, revoked_at]
            properties:
              user_id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
              id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
              platform: { type: string, enum: [ANDROID, IOS] }
              display_name: { type: [string, 'null'], maxLength: 64 }
              status: { type: string, enum: [ACTIVE, REVOKED] }
              created_at: { type: string, format: date-time }
              last_seen_at: { type: [string, 'null'], format: date-time }
              revoked_at: { type: [string, 'null'], format: date-time }
        total: { type: string, pattern: '^[0-9]{1,20}$' }
        page: { type: integer }
        page_size: { type: integer }
        observed_at: { type: string, format: date-time }
    TrafficStatItem:
      type: object
      additionalProperties: false
      description: |
        维度键只出现该维度对应的那一个字段：dim=day 给 stat_date，dim=user 给 user_id，
        dim=device 给 device_id 与它所属的 user_id（一台设备只属于一个用户），dim=node 给 node_id。
      required: [upload_bytes, download_bytes, total_bytes]
      properties:
        stat_date: { type: string, format: date }
        user_id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        device_id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        node_id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        upload_bytes: { type: string, pattern: '^[0-9]{1,20}$' }
        download_bytes: { type: string, pattern: '^[0-9]{1,20}$' }
        total_bytes: { type: string, pattern: '^[0-9]{1,20}$' }
    TrafficStatsPage:
      type: object
      additionalProperties: false
      description: total 是该维度下的分组数量，不是流量总和；observed_at 是本次快照时间。
      required: [dim, from, to, items, total, page, page_size, observed_at]
      properties:
        dim: { type: string, enum: [day, user, device, node] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        items: { type: array, items: { $ref: '#/components/schemas/TrafficStatItem' } }
        total: { type: string, pattern: '^[0-9]{1,20}$' }
        page: { type: integer }
        page_size: { type: integer }
        observed_at: { type: string, format: date-time }
    ManagedBlacklistEntry:
      type: object
      additionalProperties: false
      required: [id, target_type, target_value, effects, reason, status, expires_at, created_at, removed_at]
      properties:
        id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        target_type: { type: string, enum: [USER, DEVICE, FINGERPRINT, PAY_ADDRESS, IP_PREFIX, INVITE_CODE] }
        target_value: { type: string, maxLength: 128 }
        effects: { type: array, items: { type: string, enum: [INVITE_BIND, INVITE_REWARD, ALL] } }
        reason: { type: string, maxLength: 255 }
        status: { type: string, enum: [ACTIVE, REMOVED] }
        expires_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        removed_at: { type: [string, 'null'], format: date-time }
    ManagedExport:
      type: object
      additionalProperties: false
      required: [id, kind, range_from, range_to, status, requested_by, watermark,
                 row_count, byte_size, content_sha256, failure_reason,
                 created_at, finished_at, expires_at]
      properties:
        id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        kind: { type: string, enum: [ORDERS, CHAIN_TRANSFERS, TRAFFIC, RECONCILE] }
        # RECONCILE 恒为 null：对账是此刻的异常清单，没有区间可言。
        range_from: { type: [string, 'null'], format: date }
        range_to: { type: [string, 'null'], format: date }
        status: { type: string, enum: [PENDING, READY, FAILED, EXPIRED] }
        requested_by: { type: string, description: 发起人的管理员账号 }
        # 方案 12.4 要求的水印原文；它也逐字出现在文件的首行与末行。
        watermark: { type: string }
        # 行数不含水印行与表头。生成完成前为 null。
        row_count: { type: [string, 'null'], pattern: '^(0|[1-9][0-9]{0,18})$' }
        byte_size: { type: [string, 'null'], pattern: '^(0|[1-9][0-9]{0,18})$' }
        content_sha256: { type: [string, 'null'], pattern: '^[a-f0-9]{64}$' }
        failure_reason: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
    ManagedInviteRelation:
      type: object
      additionalProperties: false
      required: [invitee_user_id, inviter_user_id, invite_code, bind_method, risk_flags, created_at]
      properties:
        invitee_user_id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
        inviter_user_id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
