      summary: 管理员登记收款地址（不保存私钥）
      description: |
        需要 finance.address_create（L2）；二次验证 action_code=finance.address_create，
        operation_id 幂等，审计日志记下是谁登记的。

        收款地址只收 USDT。请求体里没有私钥字段，服务端也不接受未知字段。
        signature 与 sig_key_id 写入空值。新地址一律是 PAUSED，要再调用
        POST /receive-addresses/{id}/status 才会分配给新订单。

        未填写 valid_until 时默认十年。重复地址返回 40901。
      parameters: [ { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, reason, network, address]
              properties:
                operation_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 255 }
                network: { type: string, enum: [TRON, MOCK] }
                address: { type: string, minLength: 1, maxLength: 64 }
                label: { type: string, maxLength: 64 }
                valid_until: { type: string, format: date-time }
      responses:
        '201':
          description: 已登记为暂停；Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, network, address, label, status, valid_until]
                properties:
                  id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
                  network: { type: string }
                  address: { type: string }
                  label: { type: [string, 'null'] }
                  status: { type: string, enum: [PAUSED] }
                  valid_until: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
  /receive-addresses/import:
    post:
      operationId: importReceiveAddresses
      x-admin-level: L3
      x-permission: finance.address_import
      summary: 导入资金系统签名的地址包（服务端验签，双人审批后入库）
      description: |
        需要 finance.address_import（L3）；二次验证 action_code=finance.address_import。
        **返回 202 时地址还没入库**——这只是建了一张审批单，真正写入发生在另一名管理员
        在审批中心点通过的那一刻。

        在这之前，往 receive_addresses 里加地址的唯一办法是把 `cmd/fundsign` 打出来的
        INSERT 贴进 psql，而服务端**从未验过那个签名**。本接口第一次在服务端验签：
        原文格式与 cmd/fundsign 一致（`yuhai-addr-v1|{network}|{address}|{valid_until_unix}`），
        公钥取自 FUND_ADDRESS_PUBKEY_B64；未配置公钥时直接拒绝，不在没有验签能力的情况下放行。

        **任何一条验不过就整包拒绝**，一条都不入库——半包导入会留下一批来路不明的地址，
        而运维看到的只是「导入成功」。包内地址重复、network 非法、签名格式错误同理整包拒绝。

        **导入的地址一律是 PAUSED，不是 ACTIVE**：刚进来的收款地址不该在没人看过之前就开始收钱。
        要启用走 POST /receive-addresses/{id}/status。

        同一个包（按规范化后的 payload_hash 判定）重复发起会复用仍然有效的那张待审批单；
        别人已经发起过同一个包时返回 40901。审批通过时会**重新验一遍签名**并核对 payload_hash：
        审批单可能在队列里放了一天，而执行才是让这些地址进入收款流程的那一刻。
      parameters: [ { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason, package]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
                package:
                  type: object
                  additionalProperties: false
                  required: [key_id, addresses]
                  properties:
                    key_id: { type: string, minLength: 1, maxLength: 32 }
                    addresses:
                      type: array
                      minItems: 1
                      maxItems: 50
                      items:
                        type: object
                        additionalProperties: false
                        required: [network, address, valid_until, signature]
                        properties:
                          network: { type: string, enum: [TRON, MOCK] }
                          address: { type: string, minLength: 1, maxLength: 64 }
                          label: { type: string, maxLength: 64 }
                          valid_until: { type: string, format: date-time }
                          signature: { type: string, description: base64url（无填充）的 Ed25519 签名 }
      responses:
        '202': { $ref: '#/components/responses/Approval' }
        default: { $ref: '#/components/responses/Error' }
  /receive-addresses/{id}/status:
    post:
      operationId: setReceiveAddressStatus
      x-admin-level: L2
      x-permission: finance.address_status
      x-idempotent: true
      summary: 启用或停用收款地址
      description: |
        需要 finance.address_status（L2）；二次验证 action_code=finance.address_status，
        绑定 POST、实际完整路径和原始请求体；operation_id 幂等。

        **状态只影响新订单的分配**：internal/order 的 pickAddress 只挑
        `status='ACTIVE' AND valid_until > now()` 的地址。停用**不是**停止收款——
        已经发给用户的收款地址照旧有效，链上扫描也照常进行；更不是删除，
        orders / chain_transfers 都外键引用这张表。

        两处拦截：

        - **启用一个有效期已过的地址返回 40001**：pickAddress 会立刻跳过它，
          启用成功只是个假象。
        - **停用后一个可用地址返回 40901**，除非请求里带 `confirm_last_address: true`。
          没有可用地址时下单直接返回 50301「支付通道暂不可用」；全站停收款是正当操作，
          但不该在点错一个按钮时悄悄发生。

        响应里的 `active_remaining` 是本次改动之后仍然可用的地址数量，原样给出不做判断。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, reason, status]
              properties:
                operation_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 255 }
                status: { type: string, enum: [ACTIVE, PAUSED, RETIRED] }
                confirm_last_address: { type: boolean }
      responses:
        '200': { description: 已更新；Cache-Control no-store, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedReceiveAddressStatus' } } } }
        default: { $ref: '#/components/responses/Error' }

  /node-groups:
