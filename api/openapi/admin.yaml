      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: 节点详情；无查询参数。sync_status仅为UNAVAILABLE，尚无节点应用回执，不能据此判断撤销已完成。最多100条入站，超出则拒绝返回不完整成功。
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [node, inbounds, observed_at, sync_status]
                properties:
                  node: { $ref: '#/components/schemas/ManagedNode' }
                  inbounds:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, protocol, port, priority, status]
                      properties:
                        id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
                        protocol: { type: string, enum: [VLESS_REALITY, TROJAN, SS2022, WIREGUARD, HYSTERIA2] }
                        port: { type: integer, minimum: 1, maximum: 65535 }
                        priority: { type: integer }
                        status: { type: string, enum: [ENABLED, DISABLED] }
                  observed_at: { type: string, format: date-time }
                  sync_status: { type: string, enum: [UNAVAILABLE] }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateNode
      x-admin-level: L1
      x-permission: nodes.write
      x-idempotent: true
      summary: 修改节点记录（不会去联系节点本身）
      description: |
        只改数据库里的登记信息。把状态改成 ONLINE **不代表隧道可用**——
        App 侧仍要求心跳新鲜、证书指纹一致、协议就绪，任一不满足依然不可用。
        改成 DISABLED 会让该节点从所有用户的列表中消失，但**不会断开已建立的连接**，
        也不会从节点上删除任何 peer。
        至少要提供 operation_id 以外的一个字段；`agent_cert_fingerprint` 不可修改。
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id]
              properties:
                operation_id: { type: string, format: uuid }
                group_id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
                name: { type: string, minLength: 1, maxLength: 64 }
                country_code: { type: string, pattern: '^[A-Z]{2}$' }
                city: { type: string, maxLength: 64 }
                region: { type: string, minLength: 1, maxLength: 32 }
                host: { type: string, minLength: 1, maxLength: 255 }
                probe_port: { type: integer, minimum: 1, maximum: 65535 }
                capacity_users: { type: integer, minimum: 0, maximum: 1000000 }
                sort_order: { type: integer, minimum: -100000, maximum: 100000 }
                is_recommended: { type: boolean }
                status: { type: string, enum: [ONLINE, OFFLINE, MAINTENANCE, DISABLED] }
      responses:
        '200':
          description: 修改后的节点
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedNode' }
        '404': { description: 40401 节点或分组不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { description: 40901 同一 operation_id 提交了不同内容, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
  /nodes/{id}/enroll-tokens:
    post:
      operationId: createEnrollToken
      x-admin-level: L2
      x-permission: nodes.enroll_token
      summary: 为节点签发一次性注册令牌（24 小时、只能用一次、只展示一次）
      description: |
        节点拿这个令牌调用 `POST /node/v1/enroll`，用 CSR 换取客户端证书；签发成功后
        控制面才会把该证书指纹绑到这台节点上，它也才可能开始心跳。

        **令牌只在本次响应里出现一次**：服务端只存 SHA-256，之后任何人都取不回明文。
        因此本接口**不做响应重放**——同一 operation_id 再次提交返回 40901，请用新的
        operation_id 重新签发。丢了就重签，这比把密钥留在库里可回放要好。

        为同一节点签发新令牌会让该节点此前**未使用**的令牌立即过期，任何时刻最多只有一把有效。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, reason]
              properties:
                operation_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: 已签发；token 仅此一次可见
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [operation_id, node_id, token, expires_at]
                properties:
                  operation_id: { type: string, format: uuid }
                  node_id: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
                  token: { type: string, description: 一次性注册令牌，只在本次响应出现 }
                  expires_at: { type: string, format: date-time }
        '401': { description: 40110 需要二次验证 / 40111 二次验证令牌无效, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '404': { description: 40401 节点不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { description: 40901 该 operation_id 已签发过令牌（令牌不可重放，请用新的 operation_id）, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
  /nodes/{id}/revoke:
    post:
      operationId: revokeNode
      x-admin-level: L2
      x-permission: nodes.revoke
      summary: 吊销节点证书绑定并下线
      description: |
        做三件事，都是控制面这一侧的：解除该节点的证书指纹绑定、把状态置为 DISABLED、
        让它尚未使用的注册令牌立即过期。

        **不做的事同样要说清楚**：这不会去联系那台机器，不会删除它上面的任何 peer，
        **也不会断开已经建立的隧道**。它的效果是——该节点下一次连控制面时无法通过身份校验、
        拿不到新的清单，并从所有用户的节点列表中消失。要真正切断流量，必须在那台机器上操作。

        幂等：同一 operation_id 重复提交返回同一结果；已吊销的节点再次吊销也返回 204。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, reason]
              properties:
                operation_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '204': { description: 已解除绑定并下线（不代表已断开流量） }
        '401': { description: 40110 需要二次验证 / 40111 二次验证令牌无效, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '404': { description: 40401 节点不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { description: 40901 同一 operation_id 提交了不同内容, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
  /nodes/{id}/inbounds:
    get:
      operationId: listInbounds
      x-admin-level: L0
      x-permission: nodes.read
      summary: 节点入站列表，含 public_params
      description: |
        这是**唯一**会返回 `public_params` 的接口。之所以可以返回，是因为写入时就用
        严格白名单校验过：里面只可能有会发给每个客户端的公开参数，结构上放不进任何私钥。
        最多 100 条，超出则拒绝返回不完整成功。
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: 按 priority、id 升序
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, observed_at]
                properties:
                  items: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ManagedInboundDetail' } }
                  observed_at: { type: string, format: date-time }
        '404': { description: 40401 节点不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createInbound
      x-admin-level: L1
      x-permission: nodes.write
      x-idempotent: true
      summary: 为节点新增入站
      description: |
        `public_params` 按协议走**严格白名单**校验，未知字段一律拒绝——因此这里结构上
        存不进私钥。WIREGUARD 的公钥、DNS、MTU 用与节点侧、连接材料侧**同一份**实现校验
        （`nodewire`），所以一条能建出来的入站，不会在下发时才被判为「资料无效」而
        连累该节点上的全部用户。
        本轮只支持 WIREGUARD；其余协议返回 40001，不接受未经校验的参数落库。
        新增 ENABLED 入站会**立即**影响用户可见性与连接材料下发。
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, protocol, port, public_params]
              properties:
                operation_id: { type: string, format: uuid }
                protocol: { type: string, enum: [WIREGUARD] }
                port: { type: integer, minimum: 1, maximum: 65535 }
                priority: { type: integer, minimum: 0, maximum: 10000, default: 100 }
                status: { type: string, enum: [ENABLED, DISABLED], default: DISABLED }
                public_params:
                  type: object
                  additionalProperties: false
                  required: [interface, public_key, config_version]
                  properties:
                    interface: { type: string, description: 节点上的 WireGuard 接口名 }
                    public_key: { type: string, description: 节点的 WireGuard 公钥（Base64 32 字节），公开材料 }
                    config_version: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
                    dns: { type: array, maxItems: 4, items: { type: string } }
                    mtu: { type: integer, minimum: 1280, maximum: 1500 }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedInboundDetail' }
        '404': { description: 40401 节点不存在, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        '409': { description: 40901 该节点同协议同端口已存在，或同一 operation_id 提交了不同内容, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }

  /traffic/stats:
    get:
      operationId: getTrafficStats
      x-admin-level: L0
      x-permission: traffic.read
      summary: 流量统计（只读聚合）
      description: |
        需要 traffic.read。读取前后实时核验会话与权限，业务读取使用只读一致性快照。

        统计源是 traffic_daily，**它只包含已被控制面接受并入库的节点上报**：节点没上报、
        上报被拒、或凭据已无法归属到设备的那部分流量不在其中，因此这里的数字是「账面已记」的
        用量，不等于链路真实转发量，也不是实时值。

        `stat_date` 取自上报窗口结束时刻的 **UTC 日期**，不是任何人的本地日期；跨零点的会话
        会落在结束那一天。`upload_bytes` 是用户上行、`download_bytes` 是用户下行，
        两者与 `total_bytes` 一律为字符串（字节数可超过 2^53，JSON 数字会被前端读成浮点）。

        不返回节点名称、用户账号等标识信息：那些属于 nodes.read / users.read，
        拿 traffic.read 不应顺带看到。

        `from`/`to` 为闭区间的 UTC 日期，省略时默认最近 30 天（含今天）；
        `from` 晚于 `to`、跨度超过 366 天或日期不合法一律 400，不静默纠正。
        排序：dim=day 按日期倒序，其余按 total_bytes 倒序、编号升序兜底。
      parameters:
        - { name: dim, in: query, required: true, schema: { type: string, enum: [day, user, device, node] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { description: 聚合统计, content: { application/json: { schema: { $ref: '#/components/schemas/TrafficStatsPage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /exports:
    get:
      operationId: listExports
      x-admin-level: L0
      x-permission: exports.read
      summary: 导出任务列表（只读，不含文件内容）
      description: |
        需要 exports.read。这同时也是查询生成进度的入口：`POST /exports` 返回 202 之后，
        文件由 worker 异步生成，轮询这里看 `status` 从 PENDING 变成 READY 或 FAILED。

        **本接口永远不返回文件内容**，只返回元数据：行数、字节数、内容 SHA-256、
        水印、到期时间、失败原因。取文件要另外带二次验证走
        `POST /exports/{id}/download`——那才是数据离开系统的那一刻，是另一个能力。

        `status` 的含义：PENDING 排队或正在生成；READY 可下载；FAILED 生成失败，
        `failure_reason` 原样给出（最常见的是超过行数或体积上限，要缩小区间）；
        EXPIRED 已过 24 小时保留期、文件已被删除，记录本身保留以便审计。
      parameters:
        - $ref: '#/components/parameters/Page'
        - { $ref: '#/components/parameters/PageSize' }
        - { name: kind, in: query, schema: { type: string, enum: [ORDERS, CHAIN_TRANSFERS, TRAFFIC, RECONCILE] } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, READY, FAILED, EXPIRED] } }
      responses:
        '200':
          description: 按 created_at、id 倒序
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total, page, page_size, observed_at]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ManagedExport' } }
                  total: { type: string, pattern: '^(0|[1-9][0-9]{0,18})$' }
                  page: { type: integer }
                  page_size: { type: integer }
                  observed_at: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createExport
      x-admin-level: L2
      x-permission: exports.create
      summary: 发起数据导出（异步生成，L2 + 二次验证）
      description: |
        登记一个导出任务并立刻返回 202——**这时文件还不存在**。生成由 worker 异步完成，
        进度在 `GET /exports` 上看，文件用 `POST /exports/{id}/download` 取。

        `kind` 决定导出什么，也决定 `from`/`to` 怎么填：

        | kind | 内容 | 区间 |
        |---|---|---|
        | ORDERS | 订单流水，按 `created_at` 落在区间内 | 必填 |
        | CHAIN_TRANSFERS | 链上转账，按 `block_time` | 必填 |
        | TRAFFIC | 按天/设备/节点的流量明细，按 `stat_date` | 必填 |
        | RECONCILE | 方案 10.5 的对账异常清单（余额与流水不符、固化超时未处理、已完成但没有发放流水） | **必须不填** |

        RECONCILE 是**此刻的异常清单**，不是某段时间的流水，所以带上 `from`/`to` 一律 40001
        而不是静默忽略——静默忽略会让人以为筛过了。其余三种 `from`/`to` 都必填、
        `to` 为闭区间、跨度不超过 92 天。

        投影与资金只读接口同一套口径：金额一律固定 6 位小数的字符串，
        链上 `raw` 原始载荷、收款地址签名原文、订单 `client_idem_key` 一律不出现在导出件里。

        文件是 UTF-8 CSV（带 BOM，便于 Excel 正确识别中文），**首行与末行是以 `#` 开头的
        水印行**，含管理员账号、发起时间、生成时间、导出编号与区间（方案 12.4 要求水印）。
        消费方需要跳过这两行；末行同时可以用来判断文件有没有被截断。

        上限：20 万行或 32 MiB，先到者为准。超限不会返回半份数据，而是把任务置为 FAILED
        并在 `failure_reason` 里说明要缩小区间。上限在生成时判定，不在这里预检——
        预检要先扫一遍全表，代价比失败一次更大。

        文件 24 小时后由 worker 删除（方案 12.4），记录本身转为 EXPIRED 保留以便审计。

        幂等：同一 `operation_id` 重复提交返回首次的 202 响应，不会生成第二份文件；
        换了请求体一律 40901。
      parameters: [ { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, kind, reason]
              properties:
                operation_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 200 }
                kind: { type: string, enum: [ORDERS, CHAIN_TRANSFERS, TRAFFIC, RECONCILE] }
                from: { type: string, format: date }
                to: { type: string, format: date }
      responses:
        '202':
          description: 已登记，异步生成；下载与生成均在审计日志留痕
          content: { application/json: { schema: { $ref: '#/components/schemas/ManagedExport' } } }
        default: { $ref: '#/components/responses/Error' }
  /exports/{id}/download:
    post:
      operationId: downloadExport
      x-admin-level: L2
      x-permission: exports.download
      summary: 取回导出文件（L2 + 二次验证，每次下载都写审计日志）
      description: |
        返回 CSV 文件本身。用 POST 而不是 GET，是因为这一步要消费一次性二次验证令牌，
        而且**每一次下载都要单独写一条审计日志**——数据离开系统的次数必须逐次可数。
        二次验证令牌一次一用，因此连续下载两次需要两次二次验证，这是有意的。

        `exports.download` 与 `exports.create` 是两个能力：可以让人发起导出而不能自己取走。

        只有 READY 的导出可以下载。PENDING 返回 40901（还没生成好），
        FAILED 返回 40901 并附失败原因，EXPIRED 或已过 `expires_at` 返回 40401——
        过期就是过期，不会临时再生成一份。

        响应体是 CSV 原文，不套 JSON 信封；`Content-Disposition` 给出文件名，
        `Cache-Control: no-store`。`X-Export-Sha256` 回带内容校验和，与
        `GET /exports` 里的 `content_sha256` 一致，可用于核对下载是否完整。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: CSV 文件
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Export-Sha256: { schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content: { text/csv: { schema: { type: string, format: binary } } }
        '404': { description: 40401 导出不存在或已过保留期, content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } } }
        default: { $ref: '#/components/responses/Error' }

  /invite-relations:
    get:
      operationId: listInviteRelations
      x-admin-level: L0
      x-permission: invite.read
      summary: 邀请关系列表（只读）
      description: |
        每个用户只能被邀请一次，因此 invitee_user_id 是主键。
        `risk_flags` 是绑定当时记下的风险标记原样返回，不做解释。
      parameters:
        - $ref: '#/components/parameters/Page'
        - { name: inviter_user_id, in: query, schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' } }
        - { name: invitee_user_id, in: query, schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' } }
      responses:
        '200':
          description: 按 created_at 倒序
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total, page, page_size, observed_at]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ManagedInviteRelation' } }
                  total: { type: string, pattern: '^(0|[1-9][0-9]{0,18})$' }
                  page: { type: integer }
                  page_size: { type: integer }
                  observed_at: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
  /invite-rewards:
    get:
      operationId: listInviteRewards
      x-admin-level: L0
      x-permission: invite.read
      summary: 邀请奖励列表（只读）
      description: |
        运维真正要看的是 `status=REVIEW` 那一批——它们被风控挂起，
        **worker 不会再碰**（只处理 PENDING），只能由人在
        `POST /invite-rewards/{id}/review` 放行或驳回。

        `reward_value` 的单位随 `reward_type` 变，因此一律附带 `value_unit`：
        DAYS→天、TRAFFIC→字节、BALANCE→USDT 微单位。只有 BALANCE 才有
        `amount`（固定 6 位小数的 USDT 字符串）。
        `rule_snapshot` 不返回：体量大，而复核需要的信息已在其余字段里。
      parameters:
        - $ref: '#/components/parameters/Page'
        - { name: status, in: query, schema: { type: string, enum: [PENDING, REVIEW, RELEASED, CANCELLED] } }
        - { name: beneficiary_user_id, in: query, schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' } }
      responses:
        '200':
          description: 按 created_at、id 倒序
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, total, page, page_size, observed_at]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ManagedInviteReward' } }
                  total: { type: string, pattern: '^(0|[1-9][0-9]{0,18})$' }
                  page: { type: integer }
                  page_size: { type: integer }
                  observed_at: { type: string, format: date-time }
        default: { $ref: '#/components/responses/Error' }
  /invite-rewards/{id}/review:
    post:
      operationId: reviewInviteReward
      x-admin-level: L2
      x-permission: invite.reward_review
      x-idempotent: true
      summary: 复核邀请奖励（放行或驳回）
      description: |
        只处置处于 `REVIEW` 的奖励。PENDING 归 worker，RELEASED / CANCELLED 已成定局——
        把已发放的奖励改回去属于人工账务调整，是另一条链路。

        **APPROVE 会当场发放**：余额类记 balance_ledger，时长/流量类改订阅或发流量包，
        与 worker 使用同一把幂等 key，因此不可能重复发放。

        **复核不重跑风控**——放行的含义就是「人看过这些风险标记并决定认」，
        重跑只会把它再次打回 REVIEW。但完整性检查一条不省：快照必须自洽、
        来源订单与邀请关系必须还在且没变、不能已有同 key 的账目、受益人不能已被封禁。
        任何一条不成立返回 40901 并附原因码（如 `SOURCE_ORDER_CHANGED`、
        `PREEXISTING_LEDGER`、`BENEFICIARY_BANNED`），整笔事务回滚，不存在记了一半的中间态。

        REJECT 只置为 CANCELLED 并把 note 记入 cancel_reason，不触碰任何账目。
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/StepUp'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, decision, note]
              properties:
                operation_id: { type: string, format: uuid }
                decision: { type: string, enum: [APPROVE, REJECT] }
                note: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: 已处置（同一 operation_id 重复提交返回首次结果）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewedReward' }
        '404':
          description: 40401 奖励不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        '409':
          description: 40901 该奖励不在 REVIEW，或完整性检查未通过（原因码附在消息里）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
        default: { $ref: '#/components/responses/Error' }
  /invite-rules/{id}:
    patch:
      operationId: updateInviteRule
      x-admin-level: L2
      x-permission: invite.rule_write
      x-idempotent: true
      summary: 修改邀请奖励规则
      description: |
        需要 invite.rule_write（L2）；二次验证 action_code=invite.rule_write，绑定 PATCH、
        实际完整路径和原始请求体。operation_id 幂等，换请求体 40901，重放逐字节相同。

        **不动已经生成的奖励。** 每笔奖励创建时就存了完整 rule_snapshot 并按快照结算；
        改规则只影响之后生成的，停用也不会撤回已排队的 PENDING/REVIEW。

        **trigger_event、beneficiary、reward_type 不可修改**，请求里出现即 40001：
        前两个是 invite_rewards 去重键的组成部分（去重键一变，同一受益人就同一笔订单会再拿一次奖励），
        reward_type 决定 reward_value 的单位（天 / 字节 / micro），改类型不改值等于把 30 天变成 30 字节。
        要换这三项请新建规则。

        值用**与发放侧同一份实现**校验（internal/invite 的 RuleShapeDefect），
        因为形状不合格的规则不会被跳过——发放侧照样建奖励，只是每一笔都带着 INVALID_RULE 或
        DAILY_CAP_REQUIRED 落进人工复核队列。据此拒绝的有：按比例奖励配在非 BALANCE 类型上、
        配了比例却没把 reward_value 归零、DAYS 超过 36500、TRAFFIC 超过 2^53-1、
        最低订单金额为负、INVITEE_PAID 规则没有每日上限、固定值与比例都为 0（每笔都会被判 ZERO_REWARD）。
        每日上限显式写 0 或负数一律拒绝——不限量请写 null。

        窗口是 [starts_at, ends_at)，右端开区间，因此 ends_at 必须**晚于** starts_at，相等即空窗口。

        PATCH 语义：请求体里出现的键才会被改，靠键名区分「没提」与「显式 null」。
        version 只在实质字段（数值、比例、门槛、冻结、上限、窗口）变化时 +1；
        改名称或上下架不动它——奖励快照里记着这个版本号，每改个名字就推高会让它失去对账价值。
        可选的 expected_version 做乐观并发：与当前不符返回 40901 而不是覆盖。
      parameters: [ { $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/StepUp' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [operation_id, reason]
              properties:
                operation_id: { type: string, format: uuid }
                reason: { type: string, minLength: 1, maxLength: 255 }
                expected_version: { type: string, pattern: '^[1-9][0-9]{0,9}$' }
                name: { type: string, minLength: 1, maxLength: 64 }
                status: { type: string, enum: [ENABLED, DISABLED] }
                reward_value: { type: integer, format: int64, minimum: 0 }
                reward_percent_bp: { type: [integer, 'null'], minimum: 0, maximum: 10000 }
                min_order_amount_micro: { type: [integer, 'null'], format: int64, minimum: 0 }
                freeze_hours: { type: integer, minimum: 0, maximum: 8784 }
                daily_cap_per_inviter: { type: [integer, 'null'], minimum: 1 }
                starts_at: { type: [string, 'null'], format: date-time }
                ends_at: { type: [string, 'null'], format: date-time }
      responses:
        '200': { description: 已修改；Cache-Control no-store, content: { application/json: { schema: { $ref: '#/components/schemas/ManagedInviteRule' } } } }
        default: { $ref: '#/components/responses/Error' }
  /shared-pay-addresses:
    get:
      operationId: listSharedPayAddresses
      x-admin-level: L0
      x-permission: finance.read
      summary: 公共付款地址列表（只读）
      description: |
        需要 finance.read。交易所热钱包等「多人共用」的付款地址。

        **唯一读取方是邀请风控**（internal/invite/risk_rewards.go）：从命中这里的地址付的款，
        不会被当成自邀请的铁证，而是打上 SHARED_PAY_ADDRESS 转人工复核。它不阻止下单、
        不阻止到账、也不影响任何资金流转。

        `auto_detected` 区分扫描自动识别与人工登记（本接口 POST 写入的恒为 false）。
        按登记时间倒序。
      parameters:
        - { $ref: '#/components/parameters/UserPage' }
        - { $ref: '#/components/parameters/PageSize' }
