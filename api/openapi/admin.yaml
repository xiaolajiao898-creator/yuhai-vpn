  /dev/mock-traffic:
    post: { operationId: devMockTraffic, x-admin-level: L1, x-dev-only: true, requestBody: { required: true, content: { application/json: { schema: { type: object, required: [account_no, bytes], properties: { account_no: { type: string }, bytes: { type: integer } } } } } }, responses: { '204': { description: OK } } }
  /dev/clock:
    post: { operationId: devClock, x-admin-level: L1, x-dev-only: true, requestBody: { required: true, content: { application/json: { schema: { type: object, required: [offset_seconds], properties: { offset_seconds: { type: integer } } } } } }, responses: { '204': { description: 整体拨动业务时钟 } } }

  /egress:
    get:
      operationId: listEgress
